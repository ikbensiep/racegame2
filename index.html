<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAECGAEM2</title>
  <link rel="stylesheet" href="css/style.css" type="text/css"/>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <link rel="shortcut icon" href="favicon.svg" type="image/svg" />
  <!-- G fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <!-- G icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body data-screen="lobby-menu">
  <section id="camera-viewport" data-post-processing="crt">
    <main id="canvas" class="world">
      <!-- this is for dev only so we can 'live paint' the svg while developing -->
      <!-- eventually we'll only dislpay the map as a css background image!-->
      <div id="light-layer">
        <b class="vehicle-lights player"></b>
      </div>
      <div id="worldmap"></div>
    </main>
  </section>
  <label for="debugger" style="position: fixed; z-index: 10000; padding: 1ex; filter:brightness(.25) invert(.5);">
    🛠️ debugger
  </label>
    <input type="checkbox" name="debugger" id="debugger" />
  <aside id="debug">

  </aside>
  
  <dialog id="lobby-menu">
    <form method="dialog" id="player-settings">
      <details name="game-settings" open>
        <summary>
          <div><span class="material-icons">sports_motorsports</span> Driver &amp; Car</div>
        </summary>

        <fieldset>
          <label for="player-name">
            <span>Name</span>
            <input type="text" id="player-name" value="Kees" name="player-name" placeholder="Racer" maxlength="20" required autofocus>
          </label>
          <label for="player-number">
            <span>Number</span>
            <input type="number" id="player-number" name="player-number" value="67" placeholder="99" min="1" max="999" required>
          </label>
          <label for="audio-pan-screen">
            <input type="checkbox" id="audio-pan-screen" checked />
            <span>Screen-space panning</span>
          </label>

        </fieldset>

        <div class="input-group" style="position: relative; height: 256px; width: 256px">
          <span id="player-id-wrap">
            <label for="player-number">Driver number</label>
            <label for="player-color">Paint job</label>
            <input type="color" id="player-color" value="hotpink" list="color-palette" name="player-color" />
          </span>
        <datalist id="color-palette">
          
          <!-- Retro Vibes -->
          <option title="coating-pack-A-1" value="#ff6e61">#ff6e61</option>
          <option title="coating-pack-A-2" value="#707eff">#707eff</option>
          <option title="coating-pack-A-3" value="#f2e03a">#f2e03a</option>
          <option title="coating-pack-A-4" value="#4ce1d7">#4ce1d7</option>
          <option title="coating-pack-A-5" value="#ff3d7e">#ff3d7e</option>
  
          <!-- Retro Cyber Elegance -->
          <option title="coating-pack-B-1" value="#4d9dff">#4d9dff</option>
          <option title="coating-pack-B-2" value="#ff4d8e">#ff4d8e</option>
          <option title="coating-pack-B-3" value="#ffd54d">#ffd54d</option>
          <option title="coating-pack-B-4" value="#681b98">#681b98</option>
          <option title="coating-pack-B-5" value="#00bdad">#00bdad</option>


          <!-- Sonic Adventure -->
          <option title="coating-pack-C-1" value="#1b6a98">#1b6a98</option>
          <option title="coating-pack-C-2" value="#f1c40e">#f1c40e</option>
          <option title="coating-pack-C-3" value="#e74d3c">#e74d3c</option>
          <option title="coating-pack-C-4" value="#2ecc70">#2ecc70</option>
          <option title="coating-pack-C-5" value="#8d43ad">#8d43ad</option>

          <!-- 90s Anime -->
          <option title="coating-pack-D-1" value="#ff6e61">#ff6e61</option>
          <option title="coating-pack-D-2" value="#ffb84d">#ffb84d</option>
          <option title="coating-pack-D-3" value="#6d9dc5">#6d9dc5</option>
          <option title="coating-pack-D-4" value="#5e4b8b">#5e4b8b</option>
          <option title="coating-pack-D-5" value="#da1b61">#da1b61</option>

          <!-- 1994 -->
          <option title="coating-pack-E-1" value="#d1513d">#d1513d</option>
          <option title="coating-pack-E-2" value="#f69c3c">#f69c3c</option>
          <option title="coating-pack-E-3" value="#f8c48b">#f8c48b</option>
          <option title="coating-pack-E-4" value="#9ed6e0">#9ed6e0</option>
          <option title="coating-pack-E-5" value="#4c8a9a">#4c8a9a</option>

          <!-- 90s Miami Sunset --/>
          <option title="coating-pack-F-1" value="#ff6e61">#ff6e61</option>
          <option title="coating-pack-F-2" value="#ffcb5c">#ffcb5c</option>
          <option title="coating-pack-F-3" value="#69af4b">#69af4b</option>
          <option title="coating-pack-F-4" value="#4b91e2">#4b91e2</option>
          <option title="coating-pack-F-5" value="#ee5d5d">#ee5d5d</option>
          
          Y2K Vibe 
          <option title="coating-pack-G-1" value="#1b1e37">#1b1e37</option>
          <option title="coating-pack-G-2" value="#4d4a8c">#4d4a8c</option>
          <option title="coating-pack-G-3" value="#a4a4d6">#a4a4d6</option>
          <option title="coating-pack-G-4" value="#e1b8ff">#e1b8ff</option>
          <option title="coating-pack-G-5" value="#ff7142">#ff7142</option>
          
          Scenekid 
          <option title="coating-pack-H-1" value="#ff6e61">#ff6e61</option>
          <option title="coating-pack-H-2" value="#6c5b80">#6c5b80</option>
          <option title="coating-pack-H-3" value="#88d8b1">#88d8b1</option>
          <option title="coating-pack-H-4" value="#f7b5a1">#f7b5a1</option>
          <option title="coating-pack-H-5" value="#ff9d00">#ff9d00</option>
          -->
          
        </datalist>

        <style id="fixme-sobad">
          #player-id-wrap {
            position: absolute;
            cursor: pointer;
            background: url(/assets/cars/default/interior-scaled.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: grid;
            grid-template-columns: auto 2rem;
            height: 256px;
            width: 256px;
            will-change: transform;
            
            transition: .5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            &:has(:focus) {
                rotate: -90deg;
            }

            #player-number {
              grid-area: 1 / 1 / -1 / -1;
              z-index: 2;
              width: 3rem;
              text-align: center;
              transform: rotate(90deg);
              height: 2rem;
              place-self: center end;
              font-weight: bold;
              font-size: 18px;
              padding: 0;
              border-top-width: 5px;
              text-indent: 1ex;
            }
            #player-color { 
              grid-area: 1 / 1 / -1 / -1;
              height: 100%;
              width: 100%;
              border: none;
              padding: 0;
              mask-image: url('/assets/cars/porsche/porsche-mask.png');
              mask-size: contain;
              mask-repeat: no-repeat;
              mask-position: center;
            }
            label {
              &[for="player-number"] {
                grid-area: 1 / 1 / -1 / -1;
                place-self: end;
              }
              &[for="player-color"] {
                grid-area: 1 / 1 / -1 / -1;
                place-self: start;
              }
            }
          }
          
        </style>

        <script>
          let colorInput = document.querySelector('#player-color');
          let options = [...document.querySelector('#color-palette').options];
          let color = options[Math.floor(options.length * Math.random())].value;
          document.body.style.setProperty('--player-color', color);
          colorInput.value = color;

          colorInput.addEventListener('input', (e) => {
            document.body.style.setProperty('--player-color', e.target.value);
          });

        </script>
      </div>

      </details>
      <details name="game-settings">
        <summary>
          <div><span class="material-icons">sports_motorsports</span> Track &amp; Session</div>
        </summary>
        <div class="scroll-strip">
          <span><input type="radio" id="assen" value="assen" name="track"/>TT Circuit, Assen</span>
          <span><input type="radio" id="monaco" value="monaco" name="track"/>Monte Carlo, Monaco</span>
          <span><input type="radio" id="sachsenring" value="sachsenring" name="track"/>Sachsenring, DE</span>
          <span><input type="radio" id="st-petersburg" value="st-petersburg" name="track"/>st. Petersburg GP, FL</span>
        </div>

        <fieldset class="track">
          <label for="assen">assen</label>
          <label for="monaco">monaco</label>
          <label for="sachsenring">sachsenring</label>
          <label for="st-petersburg">st. Petersburg</label>
        </fieldset>
      </details>
      <details>
        <summary style="pointer-events: all !important;">
          <div><span class="material-icons">sports_score</span>Ready</div> 
          <button type="submit" name="startGame" value="true">Drive</button>
        </summary>
      </details>

    </form>
  </dialog>

  <template id="racecar">
    <div class="vehicle car racecar">
      <div class="filter-wrap">
       <div class="car-body">
          <i class="chassis"><i class="interior"></i></i>

          <!-- bodywork stack: -->
          <!-- (all layers below are masked)-->
          <!-- filter fx (fire emitter, displacement filter)-->
          <!-- weathering / damage layers: (masked layers, blend: multi) research masking by contents? -->
          <!-- mods (spoilers) -->
          <!-- no? / default / custom livery, ::before, ::after (driver badge) -->
          <!-- .base-color (--player-color) ::before(gloss / metallic shading) radial gradient w/ splash of white, blend:multiply?, metallic: optionally masked by slight noise? (experiment)-->

          <i class="bodywork">
            <i class="base-color"></i>
            <i class="livery" data-drivernum></i>
            <i class="mods"></i>
          </i>
        </div>
      </div>
    </div>
  </template>

  <template id="structure">
    <div class="structure building">
      <div class="wall-n"></div>
      <div class="wall-e"></div>
      <div class="wall-s"></div>
      <div class="wall-w"></div>
      <div class="roof"></div>
    </div>
  </template>

  <template id="shrubbery">
    <b>
      <span class="card"></span>
      <span class="card"></span5214>
    </b>
  </template>

  <section class="sprites off-screen">
    <span id="rubberTrackSprite" class="sprite rubber"><img src="assets/cars/tire-rubber-128.png" alt="" /></span>
    <span id="smokeSprite" class="sprite smoke"><img src="assets/smoke/smoke-sprite.png" alt="" class="smoke" loading="eager"/></span>
    <span id="exhaustPopSprite" class="sprite exhaust"><img src="assets/car/exhaust-pop.png" alt="" class="pop"/></span>
    <span id="explosionsSprite" class="sprite explosion"><img src="assets/boom3.png" alt="" id="" class="explosion"/></span>
    <span id="ahornTreeSprite" class="sprite tree ahorn"></span>
    <span id="palmTreeSprite" class="sprite tree palm"></span>
    <span id="hokjeSprite" class="sprite hokje"></span>
    <span id="lampPostSprite" class="sprite lamp-post"></span>
    <img id="marshalSprite" class="sprite marshal" src="assets/people/oldman_walk_sheet_2.png" class="uv" width="512px" height="64px"/>
    <img id="pylonSprite" class="sprite pylon" src="assets/environment/cone-1.png">
    <img id="pylonSpriteWorn1" class="sprite pylon" src="assets/environment/cone-2.png">
    <img id="pylonSpriteWorn2" class="sprite pylon" src="assets/environment/cone-3.png">
    <span id="truckSprite" class="sprite truck"><img src="assets/environment/truck.png"></span>
    <div class="helicopter">
      <img src="assets/environment/helicopter-body.png" alt="" class="helicopter-body" style="scale: -1 1"/>
      <div class="rotor-blur"></div>
      <img src="assets/environment/helicopter-rotor.png" alt="" class="helicopter-rotor"/>
    </div>
  </section>

  <section class="audio">
    <audio src="./assets/sound/porsche-onboard-acc-full.ogg" class="engine" id="engineSound" loop volume="0.0"></audio>
    <audio src="./assets/sound/porsche-onboard-downshift.ogg" class="engine" id="downshiftSound" volume="0.0"></audio>
    <audio src="./assets/sound/porsche-ambient-loop.ogg" id="ambientSfx" loop volume="0.0"></audio>
    <audio src="./assets/sound/ui/click.wav" id="changeSfx"></audio>
    <audio src="./assets/sound/horn-hooter.ogg" controls class="horn" type="audio/ogg"></audio>
    <audio src="./assets/sound/701327__sef7__walkie-talkie-power-on.ogg" type="audio/ogg" id="teamRadio"></audio>
    <audio src="./assets/sound/591528__rudmer-rotteveel__ratchet-wrench-slow-multiple.ogg" class="tuningSfx" id="ratchetSound" type="audio/ogg" volume="0.25"></audio>
    <audio src="./assets/sound/349398__sevenbsb__air-impact-wrench.ogg" class="tuningSfx" id="airWrenchSound" type="audio/ogg" volume="0.15"></audio>

  </section>
  <svg id="filters">
    <filter id="displacementFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="turbulence">
          <animate attributeName="seed" from="0" to="600" begin="0s" dur="100s" repeatCount="indefinite"></animate>
      </feTurbulence>

      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G">
      </feDisplacementMap>
    </filter>
    
    <filter id="specularLight"
      style="color-interpolation-filters:sRGB;"
      inkscape:label="Specular Light"
      x="-0.050315805"
      y="-0.050315805"
      width="1.1006316"
      height="1.1006316">
    <feGaussianBlur
          in="SourceAlpha"
          stdDeviation="10"
          result="blur"
          id="feGaussianBlur67" />
    <feSpecularLighting
          in="blur"
          specularExponent="35.0"
          specularConstant="10"
          surfaceScale="5"
          lighting-color="#fce48d"
          result="specular"
          id="feSpecularLighting67">
        <feDistantLight
              azimuth="270"
              elevation="156"
              id="feDistantLight67" />
    </feSpecularLighting>
    <feComposite
          in="specular"
          in2="SourceGraphic"
          k3="1"
          k2="1"
          operator="arithmetic"
          result="composite1"
          id="feComposite67" />
    <feComposite
        in="composite1"
        in2="SourceAlpha"
        operator="in"
        result="composite2"
        id="feComposite68" />
    </filter>
    <filter id="water-loop" x="0" y="0" width="100%" height="100%">
    
    <!-- 1. Noice -->
    <feTurbulence 
      type="fractalNoise" 
      baseFrequency="0.02 0.04" 
      numOctaves="2" 
      stitchTiles="stitch" 
      result="noise" />

    <!-- 2. Shift colors for perfect loop without jump -->
    <feColorMatrix in="noise" type="hueRotate" values="0" result="animatedNoise">
      <animate 
        attributeName="values" 
        from="0" to="360" 
        dur="5s" 
        repeatCount="indefinite" />
    </feColorMatrix>

    <!-- 3. Afflpy distortion to input image -->
    <feDisplacementMap 
      in="SourceGraphic" 
      in2="animatedNoise" 
      scale="15" 
      xChannelSelector="R" 
      yChannelSelector="G" />
  </filter>


  </svg>
  <script src="js/main.js" type="module"></script>
</body>
</html>
